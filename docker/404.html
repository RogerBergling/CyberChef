<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — CyberChef</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/brand.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: var(--roger-bg, #070b14);
      --panel: var(--roger-panel, #0d1526);
      --line: var(--roger-line, rgba(148, 163, 184, .24));
      --text: var(--roger-text, #e7eefb);
      --muted: var(--roger-muted, #93a3bb);
      --accent: var(--roger-accent, #38bdf8);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(700px 480px at 20% 0%, rgba(56, 189, 248, .14), transparent 65%),
        radial-gradient(600px 420px at 90% 20%, rgba(167, 139, 250, .12), transparent 60%),
        var(--bg);
      color: var(--text);
      font: 16px/1.6 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 70px -40px rgba(0, 0, 0, .9);
    }
    p { color: var(--muted); }
    code {
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      border-radius: 9px;
      background: var(--accent);
      color: #04121c;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>404 — not found</h1>
    <p>The requested path does not exist in this CyberChef deployment.</p>
    <p><code>CyberChef</code> runs entirely in the browser. No input or recipe was sent to the server.</p>
    <a href="/">Open CyberChef</a>
  </main>
</body>
</html>
